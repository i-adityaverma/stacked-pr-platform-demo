apiVersion: apps/v1
kind: Deployment
metadata:
  name: stacked-pr-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stacked-pr-demo
  template:
    metadata:
      labels:
        app: stacked-pr-demo
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: ghcr.io/i-adityaverma/stacked-pr-platform-demo:latest
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: stacked-pr-demo
  labels:
    app: stacked-pr-demo
spec:
  selector:
    app: stacked-pr-demo
  ports:
    - name: http
      port: 80
      targetPort: http
